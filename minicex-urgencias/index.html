      BS.forEach(function(s) { if (recDe(s.id, cc)) { delete baseDe(s.id).evals[cc]; dirty[s.id + '|' + cc] = true; } });
      dirtyCands = (dirtyCands || 0) + 1; programarGuardado(); listaCands(); return;

    if (a2 === 'nueva') {

        DB.cands = []; BS.forEach(function(x) { baseDe(x.id).evals = {}; }); dirty = {}; dirtyDoc = {}; dirtyCands = false;
        msg('mx-msg-n', DEMO ? 'Listo. Se vaciaron los candidatos y las calificaciones de la vista previa.' : 'Listo. El consolidado quedó archivado en el Excel (hojas «Archivo…») y la lista de candidatos quedó vacía.');

    var card = t.closest('[data-b]');
    if (a2 === 'word' && card) { var sw = BS[+card.getAttribute('data-b') - 1]; if (!sw.items.length) { msg('mx-msg-w', 'La base ' + sw.num + ' aún no tiene rúbrica cargada.'); return; } var nw = 'MiniCEX-Urgencias-Base-' + sw.num + '-' + slug(sw.nombre) + '.docx'; avisoWord(descargar(nw, docxUnaBase(sw), MIME_DOCX), nw); return; }
    if (a2 === 'wordtodo') { var nt = 'MiniCEX-Urgencias-Bases-para-evaluadores.docx'; avisoWord(descargar(nt, docxTodas(), MIME_DOCX), nt); return; }
    if (a2 === 'editabrir' && card) { var eb = card.querySelector('[data-edit]'); if (eb.hidden) { pintarEditor(card); eb.hidden = false; } else eb.hidden = true; return; }

      vistaAdmin();
      return;

      var sb = BS[+card.getAttribute('data-b') - 1], bm = card.querySelector('[data-bmsg]'), todo = a2 === 'todoborrar';

      delete DB.casos[sb.id];
      var pb = Promise.resolve(Store.saveCaso(sb.id, '', ''));
      if (todo) { construirBase(sb, []); rubSig = ''; marcarRub(sb.id, []); }
      bm.textContent = 'Borrando…'; t.disabled = true;
      pb.then(function() { return todo ? guardarYEsperar() : null; }).then(function() {
        var bid = sb.id; vistaAdmin();
        var nc = document.querySelector('.mx-card2[data-b="' + bid + '"]'); if (nc) { nc.querySelector('[data-edit]').hidden = false; pintarEditor(nc, todo ? '✓ Caso y rúbrica borrados. Ya puedes montar el nuevo caso.' : '✓ Caso borrado. Ya puedes escribir el nuevo caso arriba o cargar el archivo con su rúbrica.'); nc.scrollIntoView({ block: 'nearest' }); }
      }, function() { t.disabled = false; bm.textContent = 'No se pudo borrar. Revisa tu conexión e inténtalo de nuevo.'; });

    if (a2 === 'rubvaciar' && card) {

  APP.addEventListener('input', function(ev) {
    var t = ev.target;
    if (t.id === 'mx-sin') { filtrarBases(); return; }
    if (t.hasAttribute('data-bnom')) { var bn = BS[+t.getAttribute('data-bnom') - 1]; bn.nombre = t.value.trim() || BASES[+bn.id - 1]; dirtyNom[bn.id] = true; dirtyDoc[bn.id] = true; programarGuardado(); return; }
    if (t.hasAttribute('data-doc')) { baseDe(t.getAttribute('data-doc')).docente = t.value.trim(); dirtyDoc[t.getAttribute('data-doc')] = true; programarGuardado(); return; }
    if (t.id === 'mx-anot-ta') { msg('mx-anot-n', t.value.length + ' / 1000'); msg('mx-anot-msg', ''); return; }
    if (t.id === 'mx-cin') { opciones(t.value); return; }
    if (t.id === 'mx-fcons') { tablaConsolidado(); return; }
    if (t.hasAttribute('data-rta')) { resumenRub(t.closest('[data-b]')); return; }
    if (t.getAttribute('data-f') === 'p') { totalEdit(t.closest('[data-b]')); return; }
    if (t.hasAttribute('data-nota') && selCC) { var st0 = BS[+vista.b - 1], rc = registro(st0.id, selCC), ix = +t.closest('.mx-it').getAttribute('data-i'); rc.n = rc.n || {}; if (t.value.trim()) rc.n[ix] = t.value; else delete rc.n[ix]; tocar(st0.id, selCC, rc); return; }
    if (t.id === 'mx-obs' && selCC) { var st = BS[+vista.b - 1], rec = registro(st.id, selCC); rec.obs = t.value; tocar(st.id, selCC, rec); }
  });

  APP.addEventListener('focusin', function(ev) { if (ev.target.id === 'mx-cin') { ev.target.select(); opciones(''); } });
  APP.addEventListener('keydown', function(ev) {
    if (ev.target.id !== 'mx-cin') return;
    if (ev.key === 'Enter') { ev.preventDefault(); var o = document.querySelector('#mx-clb .mx-opt'); if (o) elegir(o.getAttribute('data-cc')); } else if (ev.key === 'Escape') cerrarOpciones();
  });
  APP.addEventListener('change', function(ev) {
    var t = ev.target;
    if (t.hasAttribute('data-rfile')) {
      var fr = t.files && t.files[0], cd = t.closest('[data-b]'); if (!fr) return;
      archivoATexto(fr, true).then(function(txt) {
        cd._caso = null; var lineas = [];
        txt.split('\n').forEach(function(l) {
          var f = l.split('\t');
          if (/^caso(\s+cl[ií]nico)?$/i.test((f[0] || '').trim())) {
            var x = (f[2] || '').replace(/\u2029/g, '\n').replace(/^[=+\-@]+/, '').trim();
            if (x) cd._caso = { t: (f[1] || '').replace(/\u2029/g, ' ').trim().slice(0, 200), x: x.slice(0, 8000) };
            return;
          }
          lineas.push(l.replace(/\u2029/g, ' ').split('\t').slice(0, 5).join('\t'));
        });
        cd.querySelector('[data-rta]').value = lineas.join('\n'); resumenRub(cd);
      }, function() { cd.querySelector('[data-rmsg]').textContent = 'No pudimos leer ese archivo. Usa la plantilla de Excel (.xlsx) o un CSV.'; }).then(function() { t.value = ''; });
      return;
    }
    if (t.id === 'mx-file-casos') {
      var fc = t.files && t.files[0]; if (!fc) return;

        var filas = txt.split('\n').map(function(l) { return l.split('\t'); }), hechos = [], omit = 0;
        filas.forEach(function(f) {
          var b = String(f[0] || '').trim(), x = String(f[2] || '').replace(/\u2029/g, '\n').trim();
          if (!/^[1-6]$/.test(b) || !x) { if (String(f[0] || '').trim() && !/base/i.test(f[0])) omit++; else if (!String(f[0] || '').trim() && x && !/texto/i.test(x)) omit++; return; }
          hechos.push([b, String(f[1] || '').replace(/\u2029/g, ' ').trim(), x]);
        });
        if (!hechos.length) { msg('mx-msg-casos', 'No se encontró ningún caso con número de base (1 a 6). Revisa la columna A del archivo.'); return; }
        msg('mx-msg-casos', 'Guardando…');
        return hechos.reduce(function(p, h) { return p.then(function() { return Store.saveCaso(h[0], h[1], h[2]).then(function() { DB.casos[h[0]] = { t: h[1], x: h[2] }; }); }); }, Promise.resolve()).then(function() {
          msg('mx-msg-casos', hechos.length + (hechos.length === 1 ? ' caso cargado' : ' casos cargados') + (omit ? ' · ' + omit + (omit === 1 ? ' fila omitida' : ' filas omitidas') + ' (sin número de base)' : '') + '.');
          vistaAdmin();
          msg('mx-msg-casos', hechos.length + (hechos.length === 1 ? ' caso cargado' : ' casos cargados') + (omit ? ' · ' + omit + (omit === 1 ? ' fila omitida' : ' filas omitidas') + ' (sin número de base)' : '') + '.');
        });
      }).catch(function() { msg('mx-msg-casos', 'No pudimos leer o guardar ese archivo. Usa la plantilla de Excel (.xlsx) o un CSV.'); }).then(function() { t.value = ''; });
      return;
    }
    if (t.id !== 'mx-file-c') return;
    var f = t.files && t.files[0]; if (!f) return;
    archivoATexto(f).then(function(txt) { var r = parsearCands(txt); agregarCands(r.lista, r.om); }, function() { msg('mx-msg-c', 'No pudimos leer ese archivo. Usa la plantilla de Excel (.xlsx) o un CSV.'); }).then(function() { t.value = ''; });
  });

   
  (function arrancar() {

  })();
