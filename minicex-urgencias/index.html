<style>
 
:root {

html, body { margin: 0; }

  var API_OK = /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+\/|macros\/)s\/[\w-]+\/exec$/;

    if (t.id === 'mx-obs' && selCC) { var st = BS[+vista.b - 1], rec = registro(st.id, selCC); rec.obs = t.value; tocar(st.id, selCC, rec); }
  });

  APP.addEventListener('focusin', function(ev) { if (ev.target.id === 'mx-cin') { ev.target.select(); opciones(''); } });

  APP.addEventListener('change', function(ev) {
    var t = ev.target;
    if (t.hasAttribute('data-rfile')) {
      var fr = t.files && t.files[0], cd = t.closest('[data-b]'); if (!fr) return;
      archivoATexto(fr, true).then(function(txt) {
        cd._caso = null; var lineas = [];
        txt.split('\n').forEach(function(l) {
          var f = l.split('\t');
          if (/^caso(\s+cl[ií]nico)?$/i.test((f[0] || '').trim())) {
            var x = (f[2] || '').replace(/\u2029/g, '\n').replace(/^[=+\-@]+/, '').trim();
            if (x) cd._caso = { t: (f[1] || '').replace(/\u2029/g, ' ').trim().slice(0, 200), x: x.slice(0, 8000) };
            return;
          }
          lineas.push(l.replace(/\u2029/g, ' ').split('\t').slice(0, 5).join('\t'));
        });
        cd.querySelector('[data-rta]').value = lineas.join('\n'); resumenRub(cd);
      }, function() { cd.querySelector('[data-rmsg]').textContent = 'No pudimos leer ese archivo. Usa la plantilla de Excel (.xlsx) o un CSV.'; }).then(function() { t.value = ''; });
      return;

    if (t.id === 'mx-file-casos') {
      var fc = t.files && t.files[0]; if (!fc) return;
      archivoATexto(fc, true).then(function(txt) {
        var filas = txt.split('\n').map(function(l) { return l.split('\t'); }), hechos = [], omit = 0;
        filas.forEach(function(f) {
          var b = String(f[0] || '').trim(), x = String(f[2] || '').replace(/\u2029/g, '\n').trim();
          if (!/^[1-6]$/.test(b) || !x) { if (String(f[0] || '').trim() && !/base/i.test(f[0])) omit++; else if (!String(f[0] || '').trim() && x && !/texto/i.test(x)) omit++; return; }
          hechos.push([b, String(f[1] || '').replace(/\u2029/g, ' ').trim(), x]);
        });
        if (!hechos.length) { msg('mx-msg-casos', 'No se encontró ningún caso con número de base (1 a 6). Revisa la columna A del archivo.'); return; }
        msg('mx-msg-casos', 'Guardando…');
        return hechos.reduce(function(p, h) { return p.then(function() { return Store.saveCaso(h[0], h[1], h[2]).then(function() { DB.casos[h[0]] = { t: h[1], x: h[2] }; }); }); }, Promise.resolve()).then(function() {
          msg('mx-msg-casos', hechos.length + (hechos.length === 1 ? ' caso cargado' : ' casos cargados') + (omit ? ' · ' + omit + (omit === 1 ? ' fila omitida' : ' filas omitidas') + ' (sin número de base)' : '') + '.');
          vistaAdmin();
          msg('mx-msg-casos', hechos.length + (hechos.length === 1 ? ' caso cargado' : ' casos cargados') + (omit ? ' · ' + omit + (omit === 1 ? ' fila omitida' : ' filas omitidas') + ' (sin número de base)' : '') + '.');
        });
      }).catch(function() { msg('mx-msg-casos', 'No pudimos leer o guardar ese archivo. Usa la plantilla de Excel (.xlsx) o un CSV.'); }).then(function() { t.value = ''; });
      return;
    }
    if (t.id !== 'mx-file-c') return;
    var f = t.files && t.files[0]; if (!f) return;
    archivoATexto(f).then(function(txt) { var r = parsearCands(txt); agregarCands(r.lista, r.om); }, function() { msg('mx-msg-c', 'No pudimos leer ese archivo. Usa la plantilla de Excel (.xlsx) o un CSV.'); }).then(function() { t.value = ''; });
  });
