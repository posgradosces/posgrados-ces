<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Entrevistas Posgrados Clínicos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Diseño: tablero de evaluación con la identidad del aula de residentes CES (azul marino, azul cielo y lima). */
:root {
  --navy: #15284b; --navy2: #0f1d38; --blue: #004e8c; --sky: #429be2; --lime: #cadd30;
  --paper: #f4f7fb; --tint: #e3edf7; --ink: #15284b; --txt: #3b4a62; --muted: #556070;
  --line: rgba(21, 40, 75, .10); --white: #ffffff; --page: #eef2f8;
  --ok: #1f7a4d; --okbg: #e6f4ec; --okbr: #9fd2b6; --oktx: #1b6a43;
  --bad: #b3261e; --badbg: #fdecea; --badbr: #f1b5b0; --badtx: #8a1c15;
  --warnbg: #fff8d6; --warnbr: #e3d27a; --warntx: #6b5a00;
  --font: 'Montserrat', Arial, Helvetica, sans-serif;
}
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
#ces-entrevistas { box-sizing: border-box; max-width: 1180px; margin: 0 auto; background: var(--white); border-radius: 0 0 20px 20px; box-shadow: 0 10px 30px rgba(21, 40, 75, .08); overflow-wrap: anywhere; }
#ces-entrevistas *, #ces-entrevistas *::before, #ces-entrevistas *::after { box-sizing: border-box; }
#ces-entrevistas [hidden] { display: none !important; }
.mx-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; padding: 28px 44px; background: var(--navy); border-bottom: 5px solid var(--lime); }
.mx-top p { margin: 0; }
.mx-top .e { color: var(--lime); font-size: 14px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 6px; }
.mx-top .t { color: #fff; font-size: clamp(22px, 2.4vw, 30px); font-weight: 800; line-height: 1.2; letter-spacing: -.3px; }
.mx-top img { display: block; height: 86px; width: auto; max-width: 100%; }
.mx-hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #15284b 0%, #0f1d38 50%, #004e8c 100%); border-radius: 0 0 32px 32px; box-shadow: 0 10px 26px rgba(21, 40, 75, .10); }
.mx-hero::before { content: ""; position: absolute; top: -120px; right: -80px; width: 380px; height: 380px; border-radius: 50%; background: rgba(202, 221, 48, .14); }
.mx-hero::after { content: ""; position: absolute; bottom: -150px; left: -90px; width: 330px; height: 330px; border-radius: 50%; background: rgba(66, 155, 226, .20); }
.mx-hero > div { position: relative; z-index: 2; max-width: 1000px; margin: 0 auto; padding: 40px 44px; text-align: center; }
.mx-hero .e { margin: 0 0 14px; color: var(--lime); font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
.mx-hero h1 { margin: 0 0 14px; color: #fff; font-size: clamp(34px, 5vw, 58px); line-height: 1.05; font-weight: 800; letter-spacing: -1.5px; text-wrap: balance; }
.mx-hero .bar { width: 90px; height: 6px; border-radius: 3px; background: var(--lime); margin: 0 auto 20px; }
.mx-hero .s { margin: 0 0 10px; color: #fff; font-size: clamp(17px, 2vw, 22px); font-weight: 600; line-height: 1.4; }
.mx-hero .p { margin: 0 auto; max-width: 62ch; color: rgba(255, 255, 255, .85); font-size: clamp(14px, 1.5vw, 16px); line-height: 1.7; }
.mx-main { padding: 26px 34px 12px; display: flex; flex-direction: column; gap: 20px; }
.mx-stripe { display: flex; height: 6px; margin-top: 20px; }
.mx-foot-page { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 18px; padding: 22px 34px; }
.mx-foot-page p { margin: 0; font-size: 12px; color: var(--muted); }
.mx-foot-page strong { color: var(--ink); }
.mx-lbl { display: block; margin: 0 0 4px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
.mx-in { width: 100%; min-height: 46px; padding: 10px 16px; border: 1px solid #cfd8e5; border-radius: 12px; background: #fff; color: var(--ink); font-family: inherit; font-size: 14px; outline: none; }
.mx-in:focus, .mx-ta:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(66, 155, 226, .28); }
.mx-in.lg { min-height: 52px; padding: 12px 20px; border: 2px solid var(--navy); border-radius: 14px; font-size: 16px; }
.mx-ta { width: 100%; min-height: 84px; padding: 10px 14px; border: 1px solid #cfd8e5; border-radius: 12px; background: #fff; color: var(--ink); font-family: inherit; font-size: 14px; resize: vertical; outline: none; }
.mx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--navy); background: var(--navy); color: #fff; font-family: inherit; font-size: 12.5px; font-weight: 700; line-height: 1.2; cursor: pointer; text-decoration: none; }
.mx-btn:hover { background: var(--navy2); }
.mx-btn:disabled { opacity: .45; cursor: not-allowed; }
.mx-btn.sec { background: #fff; color: var(--navy); border-color: rgba(21, 40, 75, .25); }
.mx-btn.sec:hover { background: var(--paper); }
.mx-seg { display: inline-flex; gap: 6px; padding: 4px; border-radius: 999px; background: var(--tint); }
.mx-seg .mx-pillink { border-color: transparent; background: transparent; }
.mx-seg .mx-pillink.on { background: var(--navy); color: #fff; }
.mx-final { margin-top: 18px; padding: 18px 20px; border-radius: 16px; background: var(--navy); color: #fff; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.mx-final p { margin: 0; font-size: 13.5px; opacity: .9; flex: 1 1 260px; }
.mx-final .mx-btn { min-height: 52px; padding: 12px 36px; font-size: 16px; }
.mx-final-msg { margin: 10px 0 0; font-size: 13.5px; font-weight: 600; color: #8a2a1f; }
.mx-okbox { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 22px; border-radius: 16px; background: #effbf1; border: 1px solid #b7e4c0; border-left: 6px solid #2e9d4a; }
.mx-okbox .tick { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: #2e9d4a; color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
.mx-okbox h3 { margin: 0; color: #14532d; font-size: 17px; }
.mx-okbox p { margin: 2px 0 0; color: #2f4f38; font-size: 14px; }
.mx-okbox .mx-row { margin-left: auto; }
.mx-edit { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.mx-eh { margin: 18px 0 8px; color: var(--navy); font-size: 14.5px; }
.mx-er { display: grid; grid-template-columns: 34px 1fr 96px 40px; gap: 10px; align-items: start; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.mx-er .stack { display: grid; gap: 8px; min-width: 0; }
.mx-er .mx-in, .mx-er .mx-ta { min-height: 38px; padding: 7px 12px; font-size: 13.5px; }
.mx-er .mx-ta { min-height: 60px; }
.mx-er .lab { display: block; margin: 0 0 3px; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; }
.mx-er .num0 { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: var(--lime); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
@media (max-width: 640px) { .mx-er { grid-template-columns: 30px 1fr 40px; } .mx-er .pts { grid-column: 2 / 4; } }
.mx-btn.lime { background: var(--lime); border-color: var(--lime); color: var(--navy); }
.mx-btn.lime:hover { background: #bfd22a; }
.mx-btn.danger { background: var(--badbg); border-color: var(--bad); color: var(--badtx); }
.mx-btn.sm { min-height: 34px; padding: 6px 14px; font-size: 12px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.mx-band { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-radius: 16px; background: var(--navy); box-shadow: 0 8px 22px rgba(21, 40, 75, .12); }
.mx-ico { display: inline-flex; flex: 0 0 42px; width: 42px; height: 42px; align-items: center; justify-content: center; border-radius: 12px; background: var(--lime); color: var(--navy); }
.mx-band .e { display: block; color: var(--lime); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.mx-band .t { display: block; color: #fff; font-size: 17px; font-weight: 700; line-height: 1.3; }
.mx-sec-body { padding-top: 16px; }
.mx-note { margin: 0 0 14px; color: var(--txt); font-size: 14px; line-height: 1.65; }
.mx-muted { color: var(--muted); font-size: 12.5px; line-height: 1.55; margin: 0; }
.mx-start { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-radius: 16px; background: var(--paper); border: 1px solid rgba(21, 40, 75, .08); border-left: 5px solid var(--blue); }
.mx-start .e { margin: 0 0 2px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
.mx-start .d { margin: 0; color: #46556d; font-size: 14px; line-height: 1.4; }
.mx-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mx-pillink { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid rgba(21, 40, 75, .12); color: var(--navy); text-decoration: none; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.mx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: stretch; }
.mx-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 0; padding: 20px 22px; border-radius: 16px; background: var(--paper); border: 1px solid rgba(21, 40, 75, .09); border-left: 4px solid var(--blue); color: var(--navy); text-decoration: none; box-shadow: 0 6px 18px rgba(21, 40, 75, .05); cursor: pointer; font-family: inherit; text-align: left; width: 100%; }
.mx-card.alt { border-left-color: var(--lime); }
.mx-card:hover { box-shadow: 0 10px 24px rgba(21, 40, 75, .12); }
.mx-card .l { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
.mx-card .n { display: inline-flex; flex: 0 0 46px; width: 46px; height: 46px; align-items: center; justify-content: center; border-radius: 14px; background: var(--blue); color: #fff; font-size: 19px; font-weight: 800; }
.mx-card.alt .n { background: var(--lime); color: var(--navy); }
.mx-card .k { display: block; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
.mx-card .h { display: block; color: var(--navy); font-size: 16px; font-weight: 700; line-height: 1.35; }
.mx-card .m { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--navy); font-size: 13px; font-weight: 700; line-height: 1.4; }
.mx-card .m.off { color: #7a8699; font-weight: 500; }
.mx-card .m svg { color: var(--blue); flex: 0 0 auto; }
.mx-card .st { display: block; margin-top: 6px; }
.mx-card .go { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; }
.mx-card .go i { color: var(--lime); font-style: normal; }
.mx-vacio { margin: 0; padding: 20px; border-radius: 12px; background: var(--paper); border: 2px dashed rgba(21, 40, 75, .18); color: var(--muted); font-size: 14px; text-align: center; }
.mx-steps { padding: 6px 22px; border-radius: 16px; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--lime); box-shadow: 0 6px 18px rgba(21, 40, 75, .06); }
.mx-step { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; }
.mx-step + .mx-step { border-top: 1px solid rgba(21, 40, 75, .09); }
.mx-step .b { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--navy); color: var(--lime); font-size: 14px; font-weight: 800; }
.mx-step b { display: block; color: var(--navy); font-size: 15px; line-height: 1.35; }
.mx-step span { display: block; margin-top: 2px; color: #46556d; font-size: 13.5px; line-height: 1.55; }
.mx-warn { margin: 0; padding: 12px 16px; border-radius: 12px; background: var(--warnbg); border: 1px solid var(--warnbr); color: var(--warntx); font-size: 13px; line-height: 1.5; }
.mx-chip { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; background: #eef2f8; color: var(--muted); }
.mx-chip.ok { background: var(--okbg); color: var(--oktx); }
.mx-chip.warn { background: var(--warnbg); color: var(--warntx); }
.mx-chip.bad { background: var(--badbg); color: var(--badtx); }
.mx-gate { max-width: 480px; margin: 6px auto 18px; padding: 30px 28px; border-radius: 18px; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--lime); box-shadow: 0 10px 30px rgba(21, 40, 75, .08); text-align: center; }
.mx-gate .ic { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: var(--lime); margin-bottom: 14px; }
.mx-gate h2 { margin: 0 0 6px; color: var(--navy); font-size: 21px; font-weight: 800; line-height: 1.25; }
.mx-gate p { margin: 0 0 18px; color: #46556d; font-size: 14px; line-height: 1.6; }
.mx-gate form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.mx-pw { display: flex; gap: 8px; align-items: center; }
.mx-pw .mx-btn { flex: 0 0 auto; min-width: 84px; white-space: nowrap; }
.mx-err { margin: 0 !important; padding: 10px 14px; border-radius: 10px; background: var(--badbg); border: 1px solid var(--badbr); color: var(--badtx) !important; font-size: 13px !important; text-align: left; }
.mx-hint { margin: 14px 0 0 !important; padding: 10px 14px; border-radius: 10px; background: var(--warnbg); border: 1px solid var(--warnbr); color: var(--warntx) !important; font-size: 12.5px !important; text-align: left; }
.mx-back { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.mx-title { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mx-title .n { display: flex; flex: 0 0 52px; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 50%; background: var(--navy); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--lime); color: var(--lime); font-size: 20px; font-weight: 800; }
.mx-title .k { display: block; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
.mx-title h2 { margin: 0; color: var(--navy); font-size: clamp(20px, 3vw, 26px); line-height: 1.2; text-wrap: balance; }
.mx-title .m { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: #46556d; font-size: 13px; }
.mx-pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 14px; align-items: end; }
.mx-cb { position: relative; }
.mx-cb-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; max-height: 300px; overflow: auto; padding: 6px; border-radius: 14px; background: #fff; border: 1px solid rgba(21, 40, 75, .18); box-shadow: 0 14px 34px rgba(21, 40, 75, .18); }

.mx-opt:hover, .mx-opt.act { background: var(--tint); }
.mx-opt small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mx-live { position: sticky; top: 0; z-index: 12; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 18px; border-radius: 14px; background: var(--navy); color: #fff; box-shadow: 0 8px 20px rgba(21, 40, 75, .25); }
.mx-live .w { min-width: 0; }
.mx-live .w small { display: block; color: var(--lime); font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; }
.mx-live .w b { font-size: 15px; }
.mx-live .sc { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
.mx-live .sc b { font-size: 24px; font-weight: 800; color: var(--lime); }
.mx-live .sc span { font-size: 12px; color: rgba(255, 255, 255, .8); }
.mx-sec { margin: 22px 0 10px; padding: 8px 14px; border-radius: 8px; background: var(--navy); color: var(--lime); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
.mx-it { scroll-margin-top: 96px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; background: #f9fbfd; border: 1px solid rgba(21, 40, 75, .09); border-left: 4px solid #cfd8e5; }
.mx-it.is-yes { border-left-color: var(--ok); background: #f3faf6; }
.mx-it.is-no { border-left-color: var(--bad); background: #fef6f5; }
.mx-it .tx { display: flex; gap: 12px; flex: 1 1 320px; min-width: 0; }
.mx-it .nn { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 8px; background: var(--tint); color: var(--blue); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.mx-it p { margin: 0; }
.mx-it .t { color: var(--navy); font-size: 14px; font-weight: 700; line-height: 1.35; }
.mx-it .r { margin-top: 3px; color: #46556d; font-size: 12.5px; line-height: 1.5; }
.mx-it .r b { color: var(--navy); }
.mx-note-row { flex: 1 0 100%; padding-left: 40px; }
.mx-note-in { width: 100%; max-width: 560px; min-height: 34px; padding: 5px 12px; border: 1px solid #cfd8e5; border-radius: 10px; background: #fff; color: var(--ink); font-family: inherit; font-size: 12.5px; outline: none; }
.mx-note-in:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(66,155,226,.28); }
.mx-note-add { border: 0; background: none; padding: 2px 0; color: var(--blue); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline; }
.mx-obs ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.45; }
.mx-seg { display: flex; gap: 8px; flex: 0 0 auto; }
.mx-b { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid #cfd8e5; background: #fff; color: var(--navy); font-family: inherit; font-size: 12.5px; font-weight: 700; line-height: 1.2; text-align: left; cursor: pointer; }

.mx-b.no[aria-pressed="true"] small { color: var(--badtx); }
.mx-foot { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: var(--paper); border: 1px solid rgba(21, 40, 75, .08); }
.mx-tot { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 10px; }
.mx-tot b { color: var(--navy); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }

.mx-prog i { display: block; height: 100%; background: var(--sky); border-radius: 99px; }
.mx-prog i.full { background: var(--ok); }
.mx-foot-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; }
.mx-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mx-msg { margin: 10px 0 0; min-height: 20px; color: var(--blue); font-size: 13px; font-weight: 600; }
.mx-tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.mx-tb { width: 100%; min-width: 1100px; border-collapse: collapse; font-size: 13px; overflow-wrap: normal; word-break: normal; }
.mx-tb td.nm { min-width: 170px; font-weight: 600; }
.mx-tb td.cc { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--txt); }
.mx-tb th { white-space: nowrap; }

  function prepararImport(candRows, progRows) {
    var known = {}; DB.progs.forEach(function(p) { known[norm(p.nombre)] = p; });
    var pr = [], nuevos = 0;
    (progRows || []).forEach(function(r) { var n = String(r[0] == null ? '' : r[0]).trim(); if (!n || norm(n) === 'programa') return; var cu = num(r[1]); pr.push({ nombre: n, cupos: cu == null ? 0 : Math.round(cu) }); var k = known[norm(n)]; if (!k || (cu != null && Math.round(cu) !== (k.cupos || 0))) nuevos++; known[norm(n)] = known[norm(n)] || { nombre: n, cupos: 0 }; });
    var vistos = {}, dup = 0, filas = [], mal = [], sinProg = {};
    var clave = function(prog, doc, nom, ape) { return prog + '|' + (doc ? 'd:' + norm(doc) : 'n:' + norm(nom + ' ' + ape)); };
    DB.cands.forEach(function(c) { vistos[clave(c.prog, c.doc, c.nombre, c.apellidos)] = 1; });
    var idDe = {}; DB.progs.forEach(function(p) { idDe[norm(p.nombre)] = p.id; });
    (candRows || []).forEach(function(r, i) {
      var cel = function(j) { return r[j] == null ? '' : String(r[j]).trim(); };
      if (!cel(0) && !cel(1) && !cel(2)) return;
      if (norm(cel(0)) === 'programa' && i === 0) return;
      if (!known[norm(cel(0))]) { sinProg[cel(0) || '(vacío)'] = 1; mal.push(i + 1); return; }
      if (!cel(1) && !cel(2)) { mal.push(i + 1); return; }
      var kk = clave(idDe[norm(cel(0))] || norm(cel(0)), cel(3), cel(1), cel(2));
      if (vistos[kk]) { dup++; return; }
      vistos[kk] = 1;
      filas.push({ progNombre: known[norm(cel(0))].nombre, nombre: cel(1), apellidos: cel(2), doc: cel(3), bas: num(cel(4)), cli: num(cel(5)), cul: num(cel(6)) });
    });
    if (mal.length) { admImp = { error: 'No se cargó nada. Revisa las filas ' + mal.slice(0, 10).join(', ') + (mal.length > 10 ? '…' : '') + ': ' + (Object.keys(sinProg).length ? 'el programa no existe (' + Object.keys(sinProg).slice(0, 4).join(', ') + '). Escríbelo igual que en la hoja Programas.' : 'faltan nombres.') }; }
    else if (!filas.length && !nuevos) admImp = { error: dup ? 'Todos los candidatos del archivo ya estaban cargados.' : 'No se encontraron filas para cargar.' };
    else admImp = { filas: filas, progs: pr, progsNuevos: nuevos, dup: dup };
    var pv = document.getElementById('imp-prev'); if (pv) pv.innerHTML = impPrevHtml();
  }
  function leerArchivoExcel(file) {
    var pv = document.getElementById('imp-prev'); if (pv) pv.innerHTML = '<p class="mx-msg">Leyendo el archivo…</p>';
    var rd = new FileReader();
    rd.onerror = function() { admImp = { error: 'No se pudo leer el archivo.' }; if (pv) pv.innerHTML = impPrevHtml(); };
    rd.onload = function() {
      cargarXLSX().then(function(X) {
        var wb = X.read(rd.result, { type: 'array' }), pick = function(re) { for (var i = 0; i < wb.SheetNames.length; i++) if (re.test(norm(wb.SheetNames[i]))) return wb.Sheets[wb.SheetNames[i]]; return null; };
        var wc = pick(/^candidatos?$/) || (pick(/^programas?$/) ? null : wb.Sheets[wb.SheetNames[0]]), wp = pick(/^programas?$/);
        var rows = function(w) { return w ? X.utils.sheet_to_json(w, { header: 1, blankrows: false, defval: '' }) : []; };
        var cr = rows(wc); if (cr.length && norm(cr[0][0]) === 'programa') cr = cr.slice(1);
        var pr = rows(wp); if (pr.length && norm(pr[0][0]) === 'programa') pr = pr.slice(1);
        prepararImport(cr, pr);
      }).catch(function() { admImp = { error: 'No se pudo abrir el archivo. Revisa que sea un Excel (.xlsx) o usa la opción de pegar las filas.' }; if (pv) pv.innerHTML = impPrevHtml(); });
    };
    rd.readAsArrayBuffer(file);
  }
  function ejecutarImport() {
    var x = admImp; if (!x || x.error) return; admImp = null;
    msg('Cargando…');
    var paso1 = x.progs && x.progs.length ? Store.admin('importarProgramas', { progs: x.progs }) : Promise.resolve();

      aplicar(d);
      var idDe = {}; DB.progs.forEach(function(p) { idDe[norm(p.nombre)] = p.id; });
      var filas = x.filas.map(function(f) { return { prog: idDe[norm(f.progNombre)], nombre: f.nombre, apellidos: f.apellidos, doc: f.doc, bas: f.bas, cli: f.cli, cul: f.cul }; });
      return filas.length ? Store.admin('importar', { filas: filas }) : { ok: true, n: 0 };
    }).then(function(r) { return Store.load().then(function(d) { aplicar(d); vistaAdmin(); msg('Listo. Se cargaron ' + x.filas.length + ' candidatos' + (x.progsNuevos ? ' y se actualizaron los programas.' : '.')); }); })
      .catch(function() { vistaAdmin(); msg('No se pudo completar la carga. Revisa los datos e inténtalo de nuevo.', true); });
  }
  function admCierre() {
    var nC = DB.cands.length, nP = DB.progs.length;
    var ps = DB.progs.filter(function(p) { return candsDe(p.id).length; });
    var opts = DB.progs.map(function(p) { return '<option value="' + esc(p.id) + '"' + (admDel && admDel.pid === p.id ? ' selected' : '') + '>' + esc(p.nombre) + ' (' + candsDe(p.id).length + ')</option>'; }).join('');
    var conf = '';
    if (admDel) {
      var que = admDel.tipo === 'todos' ? 'TODOS los candidatos (' + nC + ' en ' + ps.length + ' programas)' : 'los ' + candsDe(admDel.pid).length + ' candidatos del programa ' + ((progDe(admDel.pid) || {}).nombre || '');
      conf = '<div class="mx-rub" style="border-color:var(--badbr);background:var(--badbg)"><p style="margin:0 0 8px;font-size:14px;color:var(--badtx)"><b>Vas a borrar ' + esc(que) + '</b> con todas sus calificaciones y observaciones. Esta acción no se puede deshacer.</p>' +
        '<p class="mx-note" style="margin:0 0 10px">' + (DEMO ? 'En la vista previa no se guarda copia. ' : 'Antes de borrar, el servidor archiva una copia del consolidado en el Excel de respaldo (hojas «Archivo»). ') + 'Te recomendamos descargar el consolidado primero.</p>' +
        '<label class="mx-lbl" for="del-conf">Escribe <b>BORRAR</b> para confirmar</label><div class="mx-row"><input class="mx-in" id="del-conf" autocomplete="off" style="max-width:240px"><button class="mx-btn danger" type="button" id="del-go" data-act="dodel" disabled>Borrar definitivamente</button><button class="mx-btn sec" type="button" data-act="delno">Cancelar</button></div></div>';
    }
    return '<div class="mx-card2"><h3>1. Descarga el consolidado antes de cerrar</h3><p class="mx-muted" style="margin:4px 0 10px">Hazlo cuando terminen las entrevistas: así conservas puntajes, rankings, bonificaciones y observaciones.</p>' + descargasHtml(true).replace(/^<div class="mx-card2">/, '<div>').replace('<h3>Descargar el consolidado en Excel</h3>', '') + '</div>' +
      '<div class="mx-card2"><h3>2. Borrar candidatos al cerrar la convocatoria</h3><p class="mx-muted" style="margin:4px 0 12px">Se borran los candidatos y sus calificaciones. Los programas, las personas con acceso y los ajustes se conservan. Actualmente hay <b>' + nC + '</b> candidatos en <b>' + ps.length + '</b> de ' + nP + ' programas.</p>' +
      '<div class="mx-toolbar"><div class="mx-fld"><label class="mx-lbl" for="bp-prog">Borrar solo un programa</label><select class="mx-in" id="bp-prog">' + (opts || '<option value="">Sin programas</option>') + '</select></div>' +
      '<div class="mx-fld" style="flex:0 0 auto"><button class="mx-btn danger" type="button" data-act="askprog"' + (nC ? '' : ' disabled') + '>Borrar candidatos de este programa</button></div>' +
      '<div class="mx-fld" style="flex:0 0 auto"><button class="mx-btn danger" type="button" data-act="askall"' + (nC ? '' : ' disabled') + '>Borrar todos los candidatos</button></div></div>' + conf + '</div>';
  }
  function num(v) { v = String(v == null ? '' : v).trim().replace(',', '.'); return v === '' || isNaN(v) ? null : +v; }
  function rowVals(tr) { var o = {}; [].forEach.call(tr.querySelectorAll('[data-f]'), function(i) { if (i.getAttribute('data-f') === 'prg') { if (i.checked) (o.prg = o.prg || []).push(i.value); } else o[i.getAttribute('data-f')] = i.value; }); return o; }

  /* ---------------- eventos ---------------- */
  APP.addEventListener('click', function(ev) {
    var t = ev.target.closest('button,[data-go]'); if (!t) return;
    var g = t.getAttribute('data-go');
    if (g !== null && !t.hasAttribute('data-act')) { ir(g); return; }
    var act = t.getAttribute('data-act');
    if (act === 'salir') { try { location.hash = ''; } catch (e) {} salir(); return; }
    if (act === 'actualizar') { setEstado('guardando'); sincronizar().then(function() { pintar(); }); return; }
    if (act === 'csv') { descargarCSV(); return; }
    if (t.hasAttribute('data-det')) { var did = t.getAttribute('data-det'); if (consState.exp[did]) delete consState.exp[did]; else consState.exp[did] = true; tablaConsolidado(); return; }
    if (act === 'expall' || act === 'colall') {
      var mpx = misProgs(), pidsx = prog === 'todos' ? mpx.map(function(p) { return p.id; }) : [prog];
      pidsx.forEach(function(pid) { candsDe(pid).forEach(function(c) { if (act === 'expall') consState.exp[c.id] = true; else delete consState.exp[c.id]; }); });
      tablaConsolidado(); return;
    }
    if (t.hasAttribute('data-dl')) { descargar(t.getAttribute('data-dl')); return; }
    var cc = t.getAttribute('data-c');
    if (cc && vista.tipo === 'cand') { var v = t.getAttribute('data-v'); mutar(vista.id, function(r) { var nv = v === 'na' ? 'na' : +v; if (r.r[cc] === nv) delete r.r[cc]; else r.r[cc] = nv; }); return; }
    var bn = t.getAttribute('data-bon'); if (bn && vista.tipo === 'cand') { var bv = +t.getAttribute('data-v'); mutar(vista.id, function(r) { if (r.bon[bn] === bv) delete r.bon[bn]; else r.bon[bn] = bv; }); return; }
    var rd = t.getAttribute('data-rd'); if (rd && vista.tipo === 'cand') { var rv = t.getAttribute('data-v'); mutar(vista.id, function(r) { if (r.rd[rd] === rv) delete r.rd[rd]; else r.rd[rd] = rv; }); return; }
    if (t.hasAttribute('data-tab')) { admTab = t.getAttribute('data-tab'); vistaAdmin(); return; }
    if (!esAdmin()) return;
    if (act === 'impok') { ejecutarImport(); return; }
    if (act === 'impno') { admImp = null; var pvx = document.getElementById('imp-prev'); if (pvx) pvx.innerHTML = ''; return; }
    if (act === 'askprog') { var bp = document.getElementById('bp-prog'); if (bp && bp.value) { admDel = { tipo: 'prog', pid: bp.value }; vistaAdmin(); var dc = document.getElementById('del-conf'); if (dc) dc.focus(); } return; }
    if (act === 'askall') { admDel = { tipo: 'todos' }; vistaAdmin(); var dc2 = document.getElementById('del-conf'); if (dc2) dc2.focus(); return; }
    if (act === 'delno') { admDel = null; vistaAdmin(); return; }
    if (act === 'dodel') {
      var dcv = document.getElementById('del-conf'); if (!dcv || dcv.value.trim().toUpperCase() !== 'BORRAR' || !admDel) return;
      var d0 = admDel; admDel = null;
      var pidsA = d0.tipo === 'todos' ? DB.progs.map(function(x) { return x.id; }) : [d0.pid];
      var arch = DEMO ? Promise.resolve() : Store.admin('archivar', { etiqueta: d0.tipo === 'todos' ? 'Todos' : ((progDe(d0.pid) || {}).nombre || '').slice(0, 25), cons: filasConsolidado(pidsA, 'comb', true), det: filasDetalle(pidsA) });
      arch.then(function() { return Store.admin(d0.tipo === 'todos' ? 'borrarTodos' : 'borrarProg', { pid: d0.pid }); }).then(function(r) { return Store.load().then(function(d) { aplicar(d); consState.exp = {}; vistaAdmin(); msg('Listo. Se borraron ' + (r && r.candidatos != null ? r.candidatos : '') + ' candidatos y ' + (r && r.evaluaciones != null ? r.evaluaciones : '') + ' calificaciones.' + (DEMO ? '' : ' Antes de borrar se guardó una copia en hojas «Archivo…» del Google Sheets.')); }); })
        .catch(function() { vistaAdmin(); msg('No se pudo borrar. Inténtalo de nuevo.', true); });
      return;
    }
    if (t.hasAttribute('data-confirm')) {
      if (!t.classList.contains('on')) { t.classList.add('on'); t.textContent = '¿Seguro? Confirmar'; setTimeout(function() { if (t.isConnected) { t.classList.remove('on'); t.textContent = 'Eliminar'; } }, 5000); return; }
      var cf = t.getAttribute('data-confirm').split(':'), k = cf[0], id = cf[1];
      if (k === 'bc') opAdmin('borrarCandidato', { id: id }, 'Candidato eliminado.'); else if (k === 'bp') opAdmin('borrarPrograma', { id: id }, 'Programa eliminado.'); else if (k === 'bu') opAdmin('borrarUsuario', { id: id }, 'Persona eliminada.');
      return;
    }
    var sc = t.getAttribute('data-save-c'), sp = t.getAttribute('data-save-p'), su = t.getAttribute('data-save-u');
    if (sc) { var o = rowVals(t.closest('tr')); opAdmin('candidato', { id: sc, prog: o.prog, nombre: o.nombre.trim(), apellidos: o.apellidos.trim(), doc: o.doc.trim(), bas: num(o.bas), cli: num(o.cli), cul: num(o.cul) }, 'Candidato actualizado.'); return; }
    if (sp) { var op = rowVals(t.closest('tr')); if (!op.nombre.trim()) { msg('Escribe el nombre del programa.', true); return; } opAdmin('programa', { id: sp, nombre: op.nombre.trim(), cupos: num(op.cupos) || 0 }, 'Programa actualizado.'); return; }
    if (su) { var ou = rowVals(t.closest('tr')); if (!ou.nombre.trim() || !ou.usuario.trim()) { msg('Escribe el nombre y el usuario.', true); return; } if (ou.clave && ou.clave.length < 7) { msg('La clave debe tener al menos 7 caracteres.', true); return; } opAdmin('usuario', { id: su, nombre: ou.nombre.trim(), saludo: (ou.saludo || '').trim(), usuario: ou.usuario.trim(), rol: ou.rol, programas: ou.rol === 'coord' ? (ou.prg || []) : [], clave: ou.clave || '' }, 'Datos de la persona actualizados.'); return; }
    if (act === 'addcand') {
      var gv = function(i) { return document.getElementById(i).value; };
      if (!gv('nc-nom').trim() || !gv('nc-ape').trim()) { msg('Escribe los nombres y apellidos del candidato.', true); return; }
      if (!gv('nc-prog')) { msg('Primero crea un programa en la pestaña Programas.', true); return; }
      opAdmin('candidato', { prog: gv('nc-prog'), nombre: gv('nc-nom').trim(), apellidos: gv('nc-ape').trim(), doc: gv('nc-doc').trim(), bas: num(gv('nc-bas')), cli: num(gv('nc-cli')), cul: num(gv('nc-cul')) }, 'Candidato agregado.'); return;
    }
    if (act === 'imp') {
      var lineas = document.getElementById('imp-txt').value.split(/\r?\n/).filter(function(l) { return l.trim(); });
      if (!lineas.length) { msg('Pega primero las filas copiadas desde Excel.', true); return; }
      prepararImport(lineas.map(function(l) { var c = l.split('\t'); return c.length < 3 ? l.split(';') : c; }), []); return;
    }
    if (act === 'addprog') { var nn = document.getElementById('np-nom').value.trim(); if (!nn) { msg('Escribe el nombre del programa.', true); return; } opAdmin('programa', { nombre: nn, cupos: num(document.getElementById('np-cup').value) || 0 }, 'Programa agregado.'); return; }
    if (act === 'adduser') {
      var un = document.getElementById('nu-nom').value.trim(), uu = document.getElementById('nu-usr').value.trim(), ur = document.getElementById('nu-rol').value, uc = document.getElementById('nu-cla').value;
      if (!un || !uu) { msg('Escribe el nombre y el usuario.', true); return; } if (uc.length < 7) { msg('La clave debe tener al menos 7 caracteres.', true); return; }
      var pr = [].map.call(document.querySelectorAll('input[name="nu-prg"]:checked'), function(i) { return i.value; });
      if (ur === 'coord' && !pr.length) { msg('Marca al menos un programa para la coordinación.', true); return; }
      opAdmin('usuario', { nombre: un, saludo: document.getElementById('nu-sal').value.trim(), usuario: uu, rol: ur, programas: ur === 'coord' ? pr : [], clave: uc }, 'Persona agregada.'); return;
    }
    if (act === 'saveaj') {
      var mx = num(document.getElementById('aj-max').value); if (!mx || mx <= 0) { msg('El puntaje máximo del examen debe ser mayor que 0.', true); return; }
      var w = [num(document.getElementById('aj-wc').value), num(document.getElementById('aj-wd').value), num(document.getElementById('aj-wa').value)];
      if (w.some(function(x) { return x == null || x < 0; }) || !(w[0] + w[1] + w[2] > 0)) { msg('Los pesos deben ser números positivos.', true); return; }
      opAdmin('config', { conv: document.getElementById('aj-conv').value.trim(), examMax: mx, pesos: { coord: w[0], decana: w[1], admin: w[2] }, abierta: document.getElementById('aj-ab').checked }, 'Ajustes guardados.'); return;
    }
  });
  APP.addEventListener('input', function(ev) {
    var t = ev.target, ob = t.getAttribute && t.getAttribute('data-obs');
    if (t.id === 'del-conf') { var go = document.getElementById('del-go'); if (go) go.disabled = t.value.trim().toUpperCase() !== 'BORRAR'; return; }
    if (ob && vista.tipo === 'cand') { var v = t.value; mutar(vista.id, function(r) { r.obs = r.obs || {}; if (v) r.obs[ob] = v; else delete r.obs[ob]; }); }
  });
  APP.addEventListener('change', function(ev) {
    var t = ev.target;
    if (t.id === 'mx-cp') { prog = t.value; consState.det = ''; vistaConsolidado(true); }
    else if (t.id === 'mx-ce') { consState.ev = t.value; tablaConsolidado(); }
    else if (t.id === 'mx-co') { consState.orden = t.value; tablaConsolidado(); }
    else if (t.id === 'adm-fp') { admFiltro = t.value; vistaAdmin(); }
    else if (t.id === 'imp-file') { if (t.files && t.files[0]) leerArchivoExcel(t.files[0]); t.value = ''; }
    else if (t.id === 'nu-rol') { var b = document.getElementById('nu-pw'); if (b) b.hidden = t.value !== 'coord'; }
  });
  document.getElementById('mx-up').addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  if (CFG.expose) window.MX_TEST = { calcEval: calcEval, globalDe: globalDe, DB: DB, rankear: rankear, metricas: metricas, examen: examen, combinar: combinar };
  /* ---------------- arranque ---------------- */
  if (DEMO) LOCAL = localInit();
  var tok = ssGet('mx_tok');
  if (!DEMO && tok) entrar(tok, ssGet('mx_usr')); else pintar();
})();

</script>
